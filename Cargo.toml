[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/craftguild/standards.rs"
publish = false

[workspace.dependencies]
craftguild-cli = { path = "crates/craftguild-cli" }
craftguild-core = { path = "crates/craftguild-core" }
craftguild-cli-build = { path = "crates/craftguild-cli-build" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
toml = "=0.8.23"
jsonschema = { version = "=0.33.0", default-features = false }
figlet-rs = "=1.0.0"
syn = { version = "=2.0.117", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
quote = "=1.0.45"
globset = "=0.4.20"
tempfile = "=3.27.0"
semver = "=1.0.28"
toml_edit = "=0.22.27"
