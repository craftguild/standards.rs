name: Conformance
on:
  push:
    branches: [main, 'release/**']
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [warp-ubuntu-2404-x64-4x, warp-macos-26-arm64-6x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Use a cold Cargo dependency cache
        shell: bash
        run: |
          cargo_cache=$(mktemp -d "$RUNNER_TEMP/craftguild-cargo.XXXXXX")
          printf 'CARGO_HOME=%s\n' "$cargo_cache" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$cargo_cache" >> "$GITHUB_PATH"
      - name: Fetch locked workspace and example dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path examples/rust-only/Cargo.toml
          cargo fetch --locked --manifest-path examples/embedded-web/Cargo.toml
          cargo fetch --locked --manifest-path examples/independent/backend/Cargo.toml
      - run: cargo install tokei --version 15.0.0 --locked
      - run: gpg --version
      - run: npm ci
      - run: npm --prefix examples/embedded-web/web ci
      - run: npm --prefix examples/independent/frontend ci
      - run: make check
      - name: Build initializer and engine with independent SBOMs
        run: make build
      - name: Check both offline artifacts and isolated initializer install
        run: make acceptance
      - run: python3 scripts/verify_examples.py
      - name: Qualify controlled updates and clone setup through the pinned engine
        run: python3 scripts/tests/verify_initialization.py
      - run: python3 scripts/package_delivery.py --output target/delivery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: delivery-${{ runner.os }}-${{ runner.arch }}
          path: target/delivery/*
          if-no-files-found: error
  release-index:
    needs: platform
    runs-on: warp-ubuntu-2404-x64-2x
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Collect qualified flat host deliveries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'delivery-*' --dir target/host-deliveries
      - run: python3 scripts/release_metadata.py target/host-deliveries --output target/release-index
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-index
          path: target/release-index/*
          if-no-files-found: error
  consumer-msrv:
    runs-on: warp-ubuntu-2404-x64-4x
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.85.0
      - run: cargo check --locked -p craftguild-cli -p craftguild-core -p craftguild-cli-build
