[package]
name = "craftguild-standards"
description = "Craftguild banner, distribution preparation and quality tools"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["distribution"]
distribution = []
bootstrap = []

[[bin]]
name = "craftguild-standards-engine"
path = "src/main.rs"
required-features = ["distribution"]

[[bin]]
name = "craftguild-standards-bootstrap"
path = "src/bootstrap.rs"
required-features = ["bootstrap"]

[dependencies]
craftguild-cli.workspace = true
craftguild-core.workspace = true
craftguild-cli-build.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
figlet-rs.workspace = true
syn.workspace = true
proc-macro2.workspace = true
quote.workspace = true
globset.workspace = true
tempfile.workspace = true
semver.workspace = true
toml_edit.workspace = true
html5ever = "=0.40.1"
ctrlc = { version = "=3.5.2", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["signal", "process"] }
rustix = { version = "=1.1.6", features = ["process"] }

[build-dependencies]
craftguild-cli-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
